name: docs pr

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
    types:
    - opened
    - reopened
    - synchronize

permissions: {}

concurrency:
  group: docs-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Build and check docs
    uses: ./.github/workflows/docs.yml
    permissions:
      actions: read
      contents: read
    with:
      cache-namespace: "${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}"
      ref: "${{ github.event_name == 'pull_request' && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}"
      sha: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
