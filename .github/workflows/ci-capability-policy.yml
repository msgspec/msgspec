name: CI capability policy

on:
  pull_request_target:
    branches:
    - main
    types:
    - opened
    - ready_for_review
    - reopened
    - synchronize

permissions: {}

jobs:
  policy:
    name: CI capability policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
    - name: Checkout proposed repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      with:
        persist-credentials: false
        # pull_request_target runs this trusted workflow from the default branch.
        # The proposed merge is checked out only to parse workflow YAML as data.
        # Do not execute checked-out repository content in this workflow.
        ref: "${{ format('refs/pull/{0}/merge', github.event.pull_request.number) }}"
        sparse-checkout: .github
        allow-unsafe-pr-checkout: true

    - name: Audit CI definitions
      env:
        GH_TOKEN: "${{ github.token }}"
      run: |
        set -euo pipefail

        if grep -R -n -E 'zizmor:[[:space:]]*ignore' .github; then
          echo "::error::Inline zizmor ignores are not allowed"
          exit 1
        fi

        policy_root="${RUNNER_TEMP}/zizmor-policy"
        mkdir -p "${policy_root}"
        cat > "${policy_root}/zizmor.yml" <<'EOF'
        rules:
          dangerous-triggers:
            ignore:
            # Trusted policy reads the proposed merge as data without executing it.
            - ci-capability-policy.yml
            # Trusted orchestration isolates the untrusted docs build from deployment.
            - docs-deploy.yml
        EOF

        docker run --rm \
          --volume "${GITHUB_WORKSPACE}:/workspace:ro" \
          --volume "${policy_root}:/policy:ro" \
          --workdir /workspace \
          --env GH_TOKEN \
          ghcr.io/zizmorcore/zizmor:1.25.2@sha256:14ea7f5cc7c67933394a35b5a38a277397818d232602635edb2010b313afb110 \
          --config /policy/zizmor.yml \
          --strict-collection \
          --collect all \
          --persona regular \
          --format github \
          -- \
          .github
