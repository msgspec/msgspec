name: CodSpeed

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
    paths:
      - src/**
      - tests/prof/**
      - benchmarks/**
      - pyproject.toml
      - uv.lock
      - MANIFEST.in
      - setup.py
      - .pytest.toml
      - .github/workflows/codspeed.yml
  workflow_dispatch:

permissions: {}

env:
  UV_NO_EDITABLE: "true"
  # cisable glibc CPU-feature detection (AVX2) so benchmarks use the same
  # memory routines regardless of which CPU the runner lands on, reducing
  # cross-run variance. See:
  # https://codspeed.io/blog/why-glibc-faster-github-actions#how-to-fix-it-
  GLIBC_TUNABLES: "glibc.cpu.hwcaps=-AVX512F,-AVX512DQ,-AVX512_VBMI2,-AVX2,-AVX,-ERMS,-FSRM"
  RANDOMLY_SEED: "3485796098"

jobs:
  perf_benchmarks:
    name: performance benchmarks
    runs-on: codspeed-macro
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Install Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version-file: pyproject.toml

    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      with:
        enable-cache: false

    - name: Build msgspec and install profiling dependencies
      run: uv sync --group test-prof

    - name: Run benchmarks
      uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea  # v5.2.1
      with:
        mode: simulation
        run: uv run --no-sync pytest tests/prof/perf --codspeed --randomly-seed="$RANDOMLY_SEED" -k arm

  memory_benchmarks:
    name: Memory benchmarks
    runs-on: codspeed-macro
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Install Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version-file: pyproject.toml

    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      with:
        enable-cache: false

    - name: Build msgspec and install profiling dependencies
      run: uv sync --group test-prof

    - name: Run benchmarks
      uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea  # v5.2.1
      with:
        mode: memory
        run: uv run --no-sync pytest tests/prof/perf --randomly-seed="$RANDOMLY_SEED" --codspeed -k amd -m memory
