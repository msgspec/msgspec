name: docs deploy
run-name: >-
  ${{ github.event_name == 'workflow_run' && format('Docs deploy for source run {0} attempt {1}', github.event.workflow_run.id, github.event.workflow_run.run_attempt) || format('Docs preview for PR {0}', github.event.pull_request.number) }}

on:
  pull_request:
    branches:
    - main
    types:
    - opened
    - reopened
    - synchronize
  workflow_run:
    workflows:
    - docs pr
    types:
    - completed

permissions: {}

jobs:
  preview:
    name: Docs preview
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: docs-preview-check-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    environment:
      name: docs-preview-status
      url: "${{ steps.check.outputs.preview-url }}"
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      with:
        persist-credentials: false

    - name: Check docs preview
      id: check
      env:
        GH_TOKEN: "${{ github.token }}"
      run: python scripts/docs_deploy.py check

  request:
    name: Request docs deployment
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: read
      contents: read
    steps:
    - name: Checkout trusted bridge
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      with:
        persist-credentials: false
        ref: "${{ github.sha }}"

    - name: Create publisher dispatch token
      id: token
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
      with:
        app-id: "${{ vars.DOCS_APP_ID }}"
        private-key: "${{ secrets.DOCS_APP_PRIVATE_KEY }}"
        owner: msgspec
        repositories: docs-deploy
        permission-actions: write

    - name: Publish docs
      id: publish
      env:
        GH_TOKEN: "${{ github.token }}"
        DOCS_DISPATCH_TOKEN: "${{ steps.token.outputs.token }}"
      run: python scripts/docs_deploy.py request

    - name: Upload deployment result
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: docs-deployment
        path: "${{ steps.publish.outputs.result-path }}"
        if-no-files-found: error
        retention-days: 7
        overwrite: true
